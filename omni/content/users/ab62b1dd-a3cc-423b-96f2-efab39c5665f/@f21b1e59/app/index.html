<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hello</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root { --app-font: 'Public Sans', system-ui, sans-serif; }
  body { margin: 0; padding: 32px; font-family: var(--app-font); color: var(--color-text4); background: color-mix(in srgb, var(--color-text4) 1.5%, var(--color-background)); }
  body.prefers-dark { background: var(--color-background); }
  h1 { font-size: 24px; font-weight: 500; margin: 0; line-height: 1.25; }
  .sub { font-size: 14px; color: var(--color-text2); margin-top: 6px; }
  .card { margin-top: 16px; background: var(--color-surface); border: 1px solid var(--color-border1); border-radius: 8px; padding: 20px; max-width: 480px; }
  .card p { margin: 0; font-size: 14px; color: var(--color-text2); line-height: 1.5; }
</style>
</head>
<body>
  <h1 id="title">Hello</h1>
  <div class="sub" id="sub">Welcome to your first app.</div>
  <div class="card"><p>This app is ready to grow. Add queries and charts to bring in your data.</p></div>
<script>
  omni.ready.then(() => {
    const u = omni.currentUser;
    const el = document.getElementById('title');
    el.textContent = u && u.name ? 'Hello, ' + u.name : 'Hello, world';
    console.assert(el.textContent, '[omni-debug] greeting rendered');
  });
</script>
</body>
</html>
