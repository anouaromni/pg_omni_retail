<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello World 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --app-font: 'Public Sans', system-ui, sans-serif; }
  body {
    margin: 0;
    padding: 32px;
    font-family: var(--app-font);
    color: var(--color-text4);
    background: color-mix(in srgb, var(--color-text4) 1.5%, var(--color-background));
  }
  body.prefers-dark { background: var(--color-background); }
  h1 { font-size: 24px; font-weight: 500; margin: 0; line-height: 1.25; }
  .sub { font-size: 14px; color: var(--color-text2); margin: 6px 0 24px; }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border1);
    border-radius: 8px;
    padding: 20px;
    max-width: 480px;
  }
  .card h2 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .card p { font-size: 12px; color: var(--color-text2); margin: 0 0 16px; }
  .greeting { font-size: 28px; font-weight: 600; line-height: 1.25; }
  @media (max-width: 640px) { body { padding: 16px; } }
</style>
</head>
<body>
  <h1>Hello World 2</h1>
  <div class="sub">A minimal app to confirm everything is working.</div>
  <div class="card">
    <h2>Greeting</h2>
    <p>Personalized for the current viewer</p>
    <div class="greeting" id="greeting">Hello, world!</div>
  </div>
  <script>
    omni.ready.then(() => {
      const user = omni.currentUser;
      const el = document.getElementById('greeting');
      el.textContent = user && user.name ? 'Hello, ' + user.name + '!' : 'Hello, world!';
    });
  </script>
</body>
</html>
