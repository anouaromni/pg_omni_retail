# Reference this view as analytics_prod_ani_prod__supply_cost_summary
label: Supply Cost Summary
#This description was pulled from dbt.
description: One-row summary of all recorded supply costs. It has no entities;
  reporting_date is a fixed date because the source has no event date.

catalog: ANALYTICS_PROD
schema: ANI_PROD
table_name: SUPPLY_COST_SUMMARY

dimensions:
  supply_cost_summary_id:
    sql: '"SUPPLY_COST_SUMMARY_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Synthetic key for the single-row summary; it does not relate to
      another semantic model.
    primary_key: true

  reporting_date:
    sql: '"REPORTING_DATE"'
    # This description pulled from the 'supply_cost_summary' dbt semantic model (models/marts/supply_cost_summary.yml)
    description: Fixed reporting date used only to satisfy Semantic Layer
      aggregation-time requirements.

  total_supply_cost:
    sql: '"TOTAL_SUPPLY_COST"'
    #This description was pulled from dbt.
    description: Total cost of all recorded supply rows.

  _entity_supply_cost_summary:
    # Entity is defined in the 'supply_cost_summary' dbt semantic model (models/marts/supply_cost_summary.yml)
    sql: ${supply_cost_summary_id}
    description: Synthetic key for the single-row summary; it does not relate to
      another semantic model.
    hidden: true

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: supply_cost_summary
  target_schema: ANI_PROD
  description: One-row summary of all recorded supply costs. It has no entities;
    reporting_date is a fixed date because the source has no event date.
  config:
    materialized: table
  code: |-
    select
        'supply_cost_summary' as supply_cost_summary_id,
        cast('2000-01-01' as date) as reporting_date,

        coalesce(sum(supply_cost), 0) as total_supply_cost
    from {{ ref('supplies') }}
