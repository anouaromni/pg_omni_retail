# Reference this view as analytics_prod_ecomm__users
catalog: ANALYTICS_PROD
schema: ECOMM
table_name: USERS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  first_name:
    sql: '"FIRST_NAME"'

  last_name:
    sql: '"LAST_NAME"'

  email:
    sql: '"EMAIL"'

  age:
    sql: '"AGE"'

  city:
    sql: '"CITY"'

  state:
    sql: '"STATE"'

  country:
    sql: '"COUNTRY"'

  zip:
    sql: '"ZIP"'

  latitude:
    sql: '"LATITUDE"'

  longitude:
    sql: '"LONGITUDE"'

  gender:
    sql: '"GENDER"'

  created_at:
    sql: '"CREATED_AT"'
    description: When the user account was created (signup date). Distinct from
      order dates in the order_items view.

  traffic_source:
    sql: '"TRAFFIC_SOURCE"'
    label: Traffic Source
    sample_values: [ Organic, Search, Email, Facebook, Display ]
    synonyms: [ marketing channel, acquisition channel, channel ]
    ai_context: Marketing channel that acquired the user.

measures:
  count:
    aggregate_type: count

ai_context: The buyer on an order. In the order_items topic, joined many-to-one
  from order items — attributes describe the customer who placed the order.
  Includes demographics (age, gender), geography (city, state, country, zip,
  lat/long), and acquisition (traffic_source).
