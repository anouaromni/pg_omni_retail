# Reference this view as omni_dbt__fct_example
schema_label: ""
#This description was pulled from dbt.
description: Example fact table exposing the order_items mart under the fct_
  naming convention. One row per order item.

schema: omni_dbt
table_name: FCT_EXAMPLE

dimensions:
  order_item_id:
    sql: '"ORDER_ITEM_ID"'
    format: ID
    #This description was pulled from dbt.
    description: The unique key of this fact table, one row per ordered item.

  order_id:
    sql: '"ORDER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key to the order this item belongs to.

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key to the product that was ordered.

  customer_id:
    sql: '"CUSTOMER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key to the customer who placed the order.

  order_date:
    sql: '"ORDER_DATE"'
    #This description was pulled from dbt.
    description: The date the order containing this item was placed.

  product_name:
    sql: '"PRODUCT_NAME"'
    #This description was pulled from dbt.
    description: The name of the ordered product.

  product_price:
    sql: '"PRODUCT_PRICE"'
    #This description was pulled from dbt.
    description: The price of the ordered product at the time of sale.

  is_food_item:
    sql: '"IS_FOOD_ITEM"'
    #This description was pulled from dbt.
    description: Boolean flag indicating whether the ordered product is a food item.

  is_drink_item:
    sql: '"IS_DRINK_ITEM"'
    #This description was pulled from dbt.
    description: Boolean flag indicating whether the ordered product is a drink item.

  supply_cost:
    sql: '"SUPPLY_COST"'
    #This description was pulled from dbt.
    description: Total supply cost allocated to the product on this order item.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: fct_example
  target_schema: ANI_PROD
  description: Example fact table exposing the order_items mart under the fct_
    naming convention. One row per order item.
  config:
    materialized: table
  code: |-
    {{ config(materialized='table') }}

    select * from {{ ref('order_items') }}
