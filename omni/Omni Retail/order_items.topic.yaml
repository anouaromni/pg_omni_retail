base_view: analytics_prod_ecomm__order_items

# Exclude calendar date-part dimensions and the duplicate product_* fields on the inventory_items bridge from AI context.
ai_fields:
  [
    all_views.*,
    -analytics_prod_ecomm__order_items.order_year,
    -analytics_prod_ecomm__order_items.order_month,
    -analytics_prod_ecomm__order_items.order_week_of_year,
    -analytics_prod_ecomm__inventory_items.product_category,
    -analytics_prod_ecomm__inventory_items.product_name,
    -analytics_prod_ecomm__inventory_items.product_brand,
    -analytics_prod_ecomm__inventory_items.product_retail_price,
    -analytics_prod_ecomm__inventory_items.product_department,
    -analytics_prod_ecomm__inventory_items.product_sku,
    -analytics_prod_ecomm__inventory_items.product_distribution_center_id
  ]
access_filters:
  - field: analytics_prod_ecomm__products.brand
    user_attribute: brand
    values_for_unfiltered: [ all_brands ]

joins:
  analytics_prod_ecomm__users: {}
  analytics_prod_ecomm__inventory_items:
    analytics_prod_ecomm__products: {}

views:
  analytics_prod_ecomm__order_items:
    dimensions:
      discount_amount:
        sql: ${analytics_prod_ecomm__products.retail_price} -
          ${analytics_prod_ecomm__order_items.sale_price}
        label: Discount Amount
        format: currency_2
        description: Difference between the product's list price and the actual sale
          price for this line item.

    measures:
      total_list_price:
        sql: ${analytics_prod_ecomm__products.retail_price}
        label: Total List Price
        format: currency_2
        description: Total product list (retail) price across line items, before discount.
        aggregate_type: sum

      total_discount:
        sql: ${analytics_prod_ecomm__products.retail_price} -
          ${analytics_prod_ecomm__order_items.sale_price}
        label: Total Discount
        format: currency_2
        description: Total discount given (list price minus sale price) across line items.
        aggregate_type: sum

      discount_rate:
        sql: ${total_discount} / NULLIF(${total_list_price}, 0)
        label: Discount Rate
        format: percent_2
        description: Total discount as a share of total list price.

      avg_days_to_ship:
        sql: ${time_to_ship}
        label: Avg Days to Ship
        format: number_2
        description: Average elapsed days from order creation to shipment. Scoped to
          shipped line items only (is_shipped is true) — unshipped items have no
          ship date and are excluded rather than silently averaged in as zero.
        aggregate_type: average
        filters:
          is_shipped:
            is: true
        synonyms: [ shipping time, time to ship, days to ship ]

  analytics_prod_ecomm__users:
    measures:
      arpu:
        sql: ${analytics_prod_ecomm__order_items.total_sale_price} / NULLIF(${count}, 0)
        label: ARPU
        format: currency_2
        description: Average revenue per user — total realized revenue (sum of order
          line item sale price) divided by distinct user count.
        synonyms: [ average revenue per user, revenue per user ]

ai_context: |-
  Omni Retail order line items — one row per item within an order (grain = line
  item, not order). A single order with 3 products is 3 rows sharing the same
  order_id.

  Counting: use `count` for line items, `order_count` (count_distinct of
  order_id) for distinct orders — never `count` when the user asks "how many
  orders". Any per-order aggregate (e.g. average order value) must roll up to
  order_id first — averaging sale_price directly computes an average line-item
  value, not an average order value.

  Revenue: `total_sale_price` = SUM(sale_price) = actual dollars collected.
  Cancelled line items never collected payment, so add a status is_not Cancelled
  filter whenever the question is about realized/collected revenue — the
  exclusion is not baked into the measure itself. Do not exclude Returned from
  revenue — a return is a completed sale that came back; report it separately
  (net-of-returns) rather than folding it silently out of gross revenue.

  Margin/profit: `total_margin` = SUM(margin), where margin = sale_price minus
  the product's cost (products.cost). Never substitute products.retail_price
  for cost — retail_price is list price, not cost, and can drift from it.

  Discount: `total_discount` = SUM(products.retail_price) - SUM(sale_price);
  `discount_rate` = total_discount / total_list_price — both already aggregated
  as ratios of sums. Never average a per-row discount rate; that weights every
  line item equally regardless of price and skews toward cheap items.

  Shipping performance: `avg_days_to_ship` (days from created_at to shipped_at)
  is already scoped to shipped items only (is_shipped is true) — no need to add
  that filter yourself when using this measure.

  New vs. tenured buyers: `months_since_signup` = months between the buyer's
  signup (users.created_at) and this order (order_items.created_at) — two
  different created_at fields on two different views. Don't confuse "when they
  signed up" with "when they ordered".

  `status` values: Complete, Shipped, Processing, Returned, Cancelled. Cancelled
  → excluded from revenue (never collected payment). Returned → revenue was
  collected then reversed; report separately when asked about "net" or "actual
  retained" sales, don't silently merge it into Complete. Complete / Shipped /
  Processing all represent collected revenue at different fulfillment points —
  sum them together for "in-flight or completed" totals.

  Booleans vs. timestamps: use `is_shipped` / `is_delivered` / `is_returned` for
  filtering ("show me shipped orders"); use `shipped_at` / `delivered_at` /
  `returned_at` for elapsed-time or recency calculations.

  Row-level security: brand access is already enforced automatically by this
  topic's access_filters (products.brand) — never add a manual brand filter,
  it's handled for you on every query.

  Joins: users (the buyer) and products (catalog, via the inventory_items
  bridge). inventory_items is a pass-through bridge — always use products.* for
  product attributes, not the duplicate product_* fields on inventory_items
  (product_name, product_brand, product_category, product_department,
  product_sku, product_retail_price, product_distribution_center_id), which are
  denormalized snapshots that can go stale.

  Presentation: for single-step queries (one query answers the question), always
  propose a visualization of the result. For multi-step analyses (several
  dependent queries), a visualization is not required.

skills:
  monday_morning_tradepack:
    label: Run my Monday Trading Review
    input: Do you want to focus on any countries / brands, or see the whole business?
    description: |-
      Prepare a summary of weekly e-commerce sales performance for our executive trading review meeting

      We need to cover
      - How was last complete calendar week? Look at it in context of a 12 week trend, and year on year
      - North Star metric is total sale price
      - Then decompose that into number of customers (new vs repeat), number of orders, and basket size so we can understand the funnel drivers. Show how each part of the funnel is doing, use red amber and green to higlight key points
      - Check the entire business, but also look at the breakdowns by country, category, and marketing channel to make sure the averages don’t hide any problems. 
      - If there are areas in the red, do further analysis to deep dive why
      - Give an exec summary and suggested focus for the week
  story_app_builder:
    label: Build a Story App
    # NOTE: this input prompt is the COLD-START fallback only — see the
    # INVOCATION CHECK in the description below. It is not shown automatically;
    # it's shown only when that check determines the four inputs below aren't
    # already available from context.
    input: "I'll build a scrollable, clickable story app for you. A few quick
      things: (1) which dataset or topic should it be built on? (2) what's the
      story you want it to tell — the narrative or the point you want to land?
      (3) what timeframe should the report cover — e.g. last quarter, this
      fiscal year, trailing 12 months, or a specific date range? and (4) any
      styling preference — by default I'll pull your colors, type, and logo from
      the 'Company Design' page in Notion, but you can instead ask for Executive
      Minimal (white, big KPI per slide, lots of whitespace), Bold Editorial
      (dark background, oversized headline numbers, one vivid accent), Data
      Journalism (light, chart beside body text with callouts), or Dashboard
      Dark (dark mode, neon/gradient accents, KPI tiles), or paste/upload an
      image as styling inspiration and I'll match its palette, type, and mood."
    description: |-
      OPERATING CONTEXT

      You are building a "story" or "deck" data app: a sequence of full-screen slides that walk a viewer through a narrative built on a single dataset. It progresses by BOTH scrolling and clicking, and has a persistent slide advancer pinned to the bottom showing which slide the viewer is on. This is a presentation, not a dashboard — the slides are the connective tissue of an argument, not a grid of tiles.

      AUDIENCE: This is for an EXECUTIVE-STYLE audience (C-suite, VPs, board). Design and write accordingly — lead with the headline number and the "so what," keep language crisp and decision-oriented, avoid jargon and operational minutiae, and make every slide readable in seconds. Favor big, confident type, clean visuals, and a clear point of view over dense detail. Frame findings around business impact and recommended action, not methodology.

      STYLING SOURCE — do this FIRST, before the Invocation Check, every time this skill fires: search Notion for a page called "Company Design" (fallback titles if not found: "Brand Guidelines", "Design System", "Brand Kit") to pull the company's colors, typography, and logo. Treat whatever you find as the default Brand Deck styling for this build. This lookup always runs — it isn't gated by whether the user specified a theme — but an explicit theme the user names (Executive Minimal, Bold Editorial, Data Journalism, Dashboard Dark) or an inspiration image they supply always overrides it. If no matching Notion page turns up, fall back to Executive Minimal and say in one line that no company design page was found.

      INVOCATION CHECK — do this next, before anything else, every time this skill fires:

      Look back through the current conversation (prior messages, attached files, a dataset already open or referenced, explicit instructions given earlier) for the four inputs: (1) dataset/topic, (2) narrative/point, (3) timeframe, (4) styling.

      - DATASET/TOPIC IS CLEAR from context (this is the one input that can't be safely defaulted) → do NOT show the cold-start question prompt. Start building immediately:
        - Narrative missing → infer a reasonable one from the data itself once queried, and state it back in one line as you begin (e.g. "Building this around the story that renewals are the growth bottleneck — let me know if you want a different angle").
        - Timeframe missing → default to trailing 12 months, state the assumption in one line.
        - Styling missing → use the Company Design result from the STYLING SOURCE step above (or the Executive Minimal fallback), state the assumption in one line.
        - Anything explicitly given (even partially, e.g. "focus on APAC" or "make it dark") → honor it exactly; only default the parts left unspecified.
        - Proceed straight into BUILD STEPS below. No confirmation turn, no waiting for a reply.
      - DATASET/TOPIC IS NOT CLEAR (cold invocation — nothing in the conversation points to what data this should run on) → this is the only case where you stop and ask. Show the cold-start input prompt (the four questions) and wait for a reply before doing anything else. Do not guess a dataset.
      - When in doubt about whether context "counts," err toward building: a named dataset, a mentioned metric/table, or a topic discussed earlier in the thread is enough to proceed with defaults filled in — it does not need to be a fully-specified brief.

      BEFORE YOU BUILD — once the Invocation Check clears you to proceed (either because context was sufficient, or because the user has now answered the cold-start prompt), lock in:
      1. Dataset / topic to build on.
      2. The narrative — the argument or arc the story should make.
      3. Timeframe — the reporting period the story should cover (e.g. last quarter, this fiscal year, trailing 12 months, or a specific date range). Apply this timeframe consistently as a date filter across EVERY slide's query so the whole deck reflects the same period. Where a slide shows a trend, use the timeframe as the window; where it shows a point-in-time KPI, honor its end. State the covered period on the title/hook slide.
      4. Styling / theme — one of Executive Minimal, Bold Editorial, Brand Deck, Data Journalism, Dashboard Dark, an inspiration image's derived palette/mood, or whatever default was applied per the Invocation Check.

      STORY FLOW (structure every deck this way — it must have a clear, deliberate flow):
      - Lead with the MOST IMPORTANT POINT. The very first content slide (after any title/hook) states the single biggest finding — the headline number and what it means — up front. Do not bury the lede or build up to it slowly; executives should get the punchline on slide one.
      - Then follow a tight arc that fits in 5 slides total: (1) title/hook, (2) THE headline finding (most important point) — fold in just enough context to explain how we got here, (3) drivers / drill-down behind the finding, (4) implication + recommendation combined into one call-to-action slide, (5) Key Takeaways.
      - Every slide must earn its place by advancing the argument toward the recommendation. The flow should feel inevitable — each slide sets up the next. Merge rather than add: if a point doesn't carry unique weight, fold it into a neighboring slide instead of giving it its own.
      - "SO WHAT" FACTOR: every slide includes an explicit "so what" — a one-line statement of why this point matters to the business (impact, risk, or opportunity), not just what the data shows. Make it a distinct, visible element on the slide (e.g. a highlighted "So what:" line or callout beneath the visual).
      - KEY TAKEAWAYS: end the deck with a dedicated "Key Takeaways" slide — 3–5 crisp bullets summarizing the headline finding, the main drivers, the implication, and the recommended action, so a viewer who reads only that slide still gets the whole story.

      WHAT A GREAT STORY / DECK APP DOES (design principles — encode these into every build):
      - One idea per slide: a headline, a single focal visual (KPI, chart, or map), one short supporting sentence, and its "so what" line. Never crowd competing charts onto one slide.
      - Editable narrative text: wherever there is narrative — the slide headline, the supporting sentence, the "so what" line, captions, callouts, and the key takeaways — the viewer must be able to CLICK INTO that text and edit it directly (inline contenteditable). Clicking the narrative turns it into an editable field in place; clicking away commits the change. Make it visually discoverable (e.g. a subtle hover affordance or edit cursor) without cluttering the slide. This applies only to the prose/narrative, not to the data-driven values in the charts.
      - Progressive disclosure: after leading with the headline finding, reveal supporting detail slide by slide. Never show a point and its full breakdown on the same slide.
      - Two navigation modes, both always active: SCROLL — full-viewport slides with CSS scroll-snap, one slide per viewport; CLICK — next/prev arrows plus click-to-advance, with arrow-key and keyboard support too. Note: click-to-advance must not fire when the viewer is clicking into narrative text to edit it.
      - Slide advancer pinned to the bottom of the viewport: a persistent progress indicator showing the current slide — a row of dots (filled = current), a segmented bar, and/or "3 / 5" text. It updates live as the viewer scrolls or clicks, and is clickable to jump to a slide.
      - Prev/next slide THUMBNAILS: alongside the navigation, show small thumbnail previews of the previous and next slides (e.g. a miniature render or snapshot of each) flanking the current slide — a small "previous" thumbnail on the left and a small "next" thumbnail on the right. They give the viewer a peek at what came before and what's coming, and clicking a thumbnail navigates to that slide. Keep them subtle and small so they don't compete with the current slide; dim or hide the prev thumbnail on the first slide and the next thumbnail on the last.
      - Legible at a glance: large type, high contrast, minimal axis clutter, direct data labels over legends where possible.
      - Consistent chrome: same header/footer treatment, palette, and type scale on every slide so the viewer stays oriented.
      - Self-contained slides: each slide's chart is backed by its own query on the chosen dataset.
      - Keep it tight: 5 slides max — title/hook, headline finding, drivers, implication/recommendation, Key Takeaways — unless the user explicitly asks for more. 5 is a ceiling, not a target; merge adjacent points rather than padding out to it. A tight deck beats a long one — especially for an executive audience.

      BUILD STEPS:
      1. Run the STYLING SOURCE lookup (search Notion for "Company Design") and the INVOCATION CHECK. If context is sufficient, lock in the four requirements (using the Notion-derived styling, and defaults + stated assumptions for any other gaps) and proceed immediately — no confirmation turn. If the dataset/topic itself is unclear, show the cold-start prompt and stop until the user replies.
      2. Look up the chosen topic's fields, then generate ONE query per slide across the 5-slide arc (title/hook, headline finding, drivers, implication/recommendation, Key Takeaways), each answering that slide's single point. Apply the chosen timeframe as a consistent date filter on every query.
      3. Visualize each slide's query in the form that best carries its point: KPI for the headline finding, line/area for trends, bar for drivers, map for geography, funnel for stages.
      4. Assemble the slides as a full-screen sequence with CSS scroll-snap for scroll navigation, click + keyboard handlers for click navigation, the fixed bottom slide advancer (dots/segments + "N / 5") with prev/next slide thumbnails that both reflect and control the current slide, inline-editable narrative text on every slide, a "so what" line on every slide, and a closing Key Takeaways slide.
      5. Apply the chosen theme's palette, typography, and chrome consistently across every slide — using the Notion "Company Design" colors/type/logo by default, an explicit user-named theme, or a supplied inspiration image, in that order of precedence.

      SUCCESS CRITERIA:
      - Notion was searched for "Company Design" (or a fallback brand page) before styling was finalized, and its colors/type/logo were used unless the user named a different theme or supplied their own inspiration image.
      - The deck is 5 slides max — title/hook, headline finding, drivers, implication/recommendation, Key Takeaways — with adjacent points merged rather than padded out to fill more slides.
      - The Invocation Check correctly skipped the question turn whenever the dataset/topic was already established in conversation, and only asked when it was genuinely a cold start.
      - Any default applied in place of a missing narrative/timeframe/styling was stated in one line, not silently assumed.
      - The deck has a clear flow that leads with the most important point and builds inevitably toward the recommendation.
      - Every slide's data honors the chosen timeframe consistently, and the covered period is stated on the title slide.
      - Every slide has an explicit "so what" factor, and the deck ends with a Key Takeaways slide.
      - The app advances by both scrolling and clicking.
      - A bottom slide advancer is always visible and accurately shows the current slide, with small prev/next slide thumbnails flanking it.
      - All narrative text is click-to-edit inline, without interfering with click-to-advance navigation.
      - Each slide makes exactly one clear point and the slides read as a coherent, executive-ready narrative.
      - Styling is consistent and matches the user's chosen theme, inspiration image, or stated default.
      - Every slide's visual is backed by a real query on the chosen dataset.
